fragment OrderFragment on Order {
  orderNumber
  date
  status
  needsPayment
  needsProcessing
  databaseId
  orderKey
  total
  subtotal
  discountTotal
  rawDiscountTotal: discountTotal(format: RAW)
  totalTax
  shippingTotal
  paymentMethodTitle
  paymentMethod
  billing {
    ...Address
  }
  shipping {
    ...Address
  }
  customer {
    ...Customer
    downloadableItems(first: 100) {
      nodes {
        ...DownloadableItem
      }
    }
  }
  downloadableItems(first: 100) {
    nodes {
      ...DownloadableItem
    }
  }
  lineItems {
    nodes {
      ...LineItem
    }
  }
  returnEligible
  returnStatus
  returnReason
  returnDetails
  returnRequestedAt
  returnItems {
    lineItemId
    quantity
  }
  refunds {
    nodes {
      databaseId
      amount
      date
      reason
    }
  }
}
